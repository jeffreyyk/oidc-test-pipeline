# Place this file in .github/workflows/ on the repository's default branch to run it manually.
# Requires a runner with the tools noted below and a JFrog OIDC mapping allowing this workflow.
# Repository key used: jk-maven-dev-local (assumed naming pattern jk-<type>-dev-<remote|local>; edit LOCAL_REPO below if yours differs).
# The OIDC token's group needs Read, Deploy/Cache and Annotate on the repository.
# Each run publishes a new version; test packages remain in Artifactory.
# Two jobs show up separately in GitHub Actions: one using the JFrog CLI wrapper (jf mvn), one using native Maven.
# jf mvn downloads a build-info extractor JAR from releases.jfrog.io, so the runner needs outbound internet.
name: OIDC Maven publish local test - JFrog Platform

on:
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        required: true
        type: choice
        options:
          - nonprod
          - prod
        default: nonprod

permissions:
  id-token: write
  contents: read

env:
  OIDC_PROVIDER_NAME: github-oidc-cba-general
  OIDC_AUDIENCE: cba-github-actions
  JF_HOSTNAME: ${{ inputs.env == 'prod' && 'artifactory.cba' || 'psblr.jfrog.io' }}
  JF_URL: ${{ inputs.env == 'prod' && 'https://artifactory.cba' || 'https://psblr.jfrog.io' }}
  LOCAL_REPO: jk-maven-dev-local
  EXPECTED_PACKAGE_TYPE: maven

jobs:
  test-oidc-maven:
    name: Maven package - JFrog CLI (OIDC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}

      - name: Verify OIDC connectivity
        run: |
          echo "=== Server ping ==="
          jf rt ping
          echo "=== Artifactory version ==="
          jf rt curl api/system/version -s | jq '{version, revision}'

      - name: Check repository exists and has the expected package type
        run: |
          set -euo pipefail
          status=$(jf rt curl -XGET "api/repositories/${LOCAL_REPO}" -s -o "$RUNNER_TEMP/repo.json" -w "%{http_code}")
          echo "HTTP $status for repository config"
          if [ "$status" != "200" ]; then
            head -c 1000 "$RUNNER_TEMP/repo.json"; echo
            echo "::error::Cannot read repository ${LOCAL_REPO} (HTTP $status)"
            exit 1
          fi
          jq '{key, rclass, packageType}' "$RUNNER_TEMP/repo.json"
          actual=$(jq -r '.packageType // ""' "$RUNNER_TEMP/repo.json" | tr '[:upper:]' '[:lower:]')
          if [ "$actual" != "$EXPECTED_PACKAGE_TYPE" ]; then
            echo "::warning::Repository packageType is '$actual', expected '$EXPECTED_PACKAGE_TYPE'"
          fi

      - name: Build and publish with JFrog CLI (jf mvn deploy)
        run: |
          set -euo pipefail
          verify() {
            local s
            s=$(jf rt curl -XGET "$1" -s -L -o /dev/null -w "%{http_code}")
            echo "HTTP $s for $1"
            [ "$s" = "200" ] || { echo "::error::Verification failed for $1 (HTTP $s)"; exit 1; }
            echo "$1" >> "$RUNNER_TEMP/verified.txt"
          }
          workdir=$(mktemp -d "$RUNNER_TEMP/publish-cli.XXXXXX")
          cd "$workdir"
          version="1.0.0-run.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          mkdir -p src/main/java/com/example
          printf 'package com.example;\npublic class Hello { public static String hi() { return "hi"; } }\n' > src/main/java/com/example/Hello.java
          cat > pom.xml <<EOF
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example.oidc</groupId>
            <artifactId>oidc-maven-cli-test</artifactId>
            <version>${version}</version>
            <packaging>jar</packaging>
            <properties>
              <maven.compiler.release>17</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
          </project>
          EOF
          jf mvn-config --server-id-deploy=setup-jfrog-cli-server \
            --repo-deploy-releases="$LOCAL_REPO" --repo-deploy-snapshots="$LOCAL_REPO"
          # Clear build name/number so no build-info collection is attempted (see the Conan workflow)
          env -u JFROG_CLI_BUILD_NAME -u JFROG_CLI_BUILD_NUMBER \
            jf mvn -B -ntp -e -DskipTests deploy
          verify "${LOCAL_REPO}/com/example/oidc/oidc-maven-cli-test/${version}/oidc-maven-cli-test-${version}.pom"

      - name: Job summary
        if: always()
        env:
          TARGET_ENV: ${{ inputs.env }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Maven package - JFrog CLI (OIDC)"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Result | ${JOB_STATUS} |"
            echo "| Target environment | ${TARGET_ENV} |"
            echo "| Artifactory | ${JF_URL} |"
            echo "| Repository | ${LOCAL_REPO} |"
            if [ -f "$RUNNER_TEMP/repo.json" ]; then
              jq -r '"| Repository type | \(.rclass) / \(.packageType) |"' "$RUNNER_TEMP/repo.json"
            fi
            echo "| Workflow run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
            if [ -f "$RUNNER_TEMP/verified.txt" ]; then
              echo ""
              echo "**Verified:**"
              sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/verified.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test-oidc-maven-raw:
    name: Maven package - Native Maven with OIDC Token
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup JFrog CLI
        id: setup-cli
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}

      - name: Verify OIDC connectivity
        run: |
          echo "=== Server ping ==="
          jf rt ping
          echo "=== Artifactory version ==="
          jf rt curl api/system/version -s | jq '{version, revision}'

      - name: Export OIDC credentials
        env:
          OIDC_TOKEN: ${{ steps.setup-cli.outputs.oidc-token }}
          OIDC_USER: ${{ steps.setup-cli.outputs.oidc-user }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          if [ -z "$OIDC_USER" ]; then
            echo "::warning::oidc-user output is empty; clients that need basic auth may fail"
          fi
          {
            echo "JF_OIDC_TOKEN=$OIDC_TOKEN"
            echo "JF_OIDC_USER=$OIDC_USER"
            echo "JF_OIDC_USER_ENC=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$OIDC_USER")"
          } >> "$GITHUB_ENV"

      - name: Deploy with native Maven and the OIDC token
        run: |
          set -euo pipefail
          verify() {
            local s
            s=$(curl -s -L -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${JF_OIDC_TOKEN}" "${JF_URL}/artifactory/$1")
            echo "HTTP $s for $1"
            [ "$s" = "200" ] || { echo "::error::Verification failed for $1 (HTTP $s)"; exit 1; }
            echo "$1" >> "$RUNNER_TEMP/verified.txt"
          }
          workdir=$(mktemp -d "$RUNNER_TEMP/publish-raw.XXXXXX")
          cd "$workdir"
          version="1.0.0-run.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          echo "hello" > a.txt
          jar cf oidc-maven-test.jar a.txt
          cat > "$RUNNER_TEMP/settings.xml" <<'EOF'
          <settings>
            <servers>
              <server>
                <id>artifactory</id>
                <username>${env.JF_OIDC_USER}</username>
                <password>${env.JF_OIDC_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          mvn -B -ntp -s "$RUNNER_TEMP/settings.xml" \
            org.apache.maven.plugins:maven-deploy-plugin:3.1.1:deploy-file \
            -Dfile=oidc-maven-test.jar -DgroupId=com.example.oidc -DartifactId=oidc-maven-test \
            -Dversion="$version" -Dpackaging=jar -DgeneratePom=true \
            -DrepositoryId=artifactory -Durl="${JF_URL}/artifactory/${LOCAL_REPO}"
          verify "${LOCAL_REPO}/com/example/oidc/oidc-maven-test/${version}/oidc-maven-test-${version}.pom"

      - name: Job summary
        if: always()
        env:
          TARGET_ENV: ${{ inputs.env }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Maven package - Native Maven with OIDC Token"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Result | ${JOB_STATUS} |"
            echo "| Target environment | ${TARGET_ENV} |"
            echo "| Artifactory | ${JF_URL} |"
            echo "| Repository | ${LOCAL_REPO} |"
            echo "| Workflow run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
            if [ -f "$RUNNER_TEMP/verified.txt" ]; then
              echo ""
              echo "**Verified:**"
              sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/verified.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
