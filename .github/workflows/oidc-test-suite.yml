name: OIDC Test Suite - JFrog Platform
 
on:
  workflow_call:
    inputs:
      env:
        description: Target environment (nonprod or prod)
        required: true
        type: string
      upload_tcv:
        description: Upload CTRF results to TCV (requires fix_version and jira_issue_key)
        required: false
        type: boolean
        default: false
      fix_version:
        description: Jira fix version name (required when upload_tcv is true)
        required: false
        type: string
        default: ''
      jira_issue_key:
        description: Jira issue key for CTRF annotations (required when upload_tcv is true)
        required: false
        type: string
        default: ''
 
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        required: true
        type: choice
        options:
          - nonprod
          - prod
        default: nonprod
      upload_tcv:
        description: Upload CTRF results to TCV (requires fix_version and jira_issue_key)
        required: false
        type: boolean
        default: false
      fix_version:
        description: Jira fix version name (required when upload_tcv is true)
        required: false
        type: string
        default: ''
      jira_issue_key:
        description: Jira issue key for CTRF annotations (required when upload_tcv is true)
        required: false
        type: string
        default: ''
 
permissions:
  id-token: write
  contents: read
  actions: read
 
env:
  OIDC_PROVIDER_NAME: github-oidc-cba-general
  OIDC_AUDIENCE: cba-github-actions
  test_result_filename: ${{ github.event.repository.name }}.run-${{ github.run_number }}.test-results.json
 
jobs:
  resolve-env:
    name: Validate inputs and resolve environment
    runs-on: default
    outputs:
      jf_hostname: ${{ steps.resolve.outputs.jf_hostname }}
    steps:
      - id: resolve
        name: Validate inputs and resolve JFrog hostname
        run: |
          if [ "${{ inputs.upload_tcv }}" = "true" ]; then
            if [ -z "${{ inputs.fix_version }}" ] || [ -z "${{ inputs.jira_issue_key }}" ]; then
              echo "ERROR: upload_tcv=true requires both fix_version and jira_issue_key to be set" >&2
              exit 1
            fi
          fi
 
          if [ "${{ inputs.env }}" = "prod" ]; then
            jf_hostname="artifactory.cba"
          else
            jf_hostname="jfrog-poc.saas.cba"
          fi
 
          echo "jf_hostname=${jf_hostname}" >> "$GITHUB_OUTPUT"
          echo "Resolved JFrog hostname: ${jf_hostname} (env=${{ inputs.env }})"
 
  test-oidc-generic:
    name: Generic Artifact - JFrog CLI (OIDC)
    runs-on: default
    needs: resolve-env
    permissions:
      id-token: write
      contents: read
    env:
      JF_HOSTNAME: ${{ needs.resolve-env.outputs.jf_hostname }}
      JF_URL: https://${{ needs.resolve-env.outputs.jf_hostname }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
 
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}
 
      - name: Verify OIDC connectivity
        run: |
          echo "=== Server ping ==="
          jf rt ping
          echo "=== Artifactory version ==="
          jf rt curl api/system/version
 
      - name: Pull Generic package type from public remote repository - should pass
        run: |
          jf rt curl -f "npm-remote/lodash/-/lodash-4.17.21.tgz" -o lodash-4.17.21.tgz
          echo "Download from public remote succeeded - OIDC token has the required read permissions"
 
 
  test-oidc-generic-raw:
    name: Generic Artifact - Native curl with OIDC Token
    runs-on: default
    needs: resolve-env
    permissions:
      id-token: write
      contents: read
    env:
      JF_HOSTNAME: ${{ needs.resolve-env.outputs.jf_hostname }}
      JF_URL: https://${{ needs.resolve-env.outputs.jf_hostname }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
 
      - name: Setup JFrog CLI
        id: setup-cli
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}
 
      - name: Verify OIDC connectivity
        run: |
          echo "=== Server ping ==="
          jf rt ping
          echo "=== Artifactory version ==="
          jf rt curl api/system/version
 
      - name: Export OIDC token
        run: |
          echo "::add-mask::${{ steps.setup-cli.outputs.oidc-token }}"
          echo "JFROG_ACCESS_TOKEN=${{ steps.setup-cli.outputs.oidc-token }}" >> $GITHUB_ENV
 
      - name: Pull generic artifact from npm-remote using native curl - should pass
        run: |
          curl -f -L \
            -H "Authorization: Bearer $JFROG_ACCESS_TOKEN" \
            "${JF_URL}/artifactory/npm-remote/lodash/-/lodash-4.17.21.tgz" \
            -o /tmp/lodash-4.17.21.tgz
          echo "curl download from npm-remote using OIDC token succeeded - OIDC token has the required read permissions"
 
  test-oidc-docker:
    name: Docker Image - JFrog CLI (OIDC)
    runs-on: default
    needs: resolve-env
    permissions:
      id-token: write
      contents: read
    env:
      JF_HOSTNAME: ${{ needs.resolve-env.outputs.jf_hostname }}
      JF_URL: https://${{ needs.resolve-env.outputs.jf_hostname }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
 
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}
 
      - name: Verify OIDC connectivity
        run: |
          echo "=== Server ping ==="
          jf rt ping
          echo "=== Artifactory version ==="
          jf rt curl api/system/version
 
      - name: Authenticate Docker with JFrog (OIDC)
        run: |
          jf docker login "$JF_HOSTNAME"
          echo "Docker login to $JF_HOSTNAME successful"
 
      - name: Pull Docker image from public remote repository - should pass
        run: |
          REMOTE_IMAGE="$JF_HOSTNAME/dockerhub-remote/nginx:1.28.0-alpine"
          jf docker pull --platform=linux/amd64 $REMOTE_IMAGE
          PULLED_IMAGE_ID=$(docker inspect --format='{{.Id}}' $REMOTE_IMAGE)
          echo "Pulled image      : $REMOTE_IMAGE"
          echo "Pulled image ID   : $PULLED_IMAGE_ID"
          if [ -z "$PULLED_IMAGE_ID" ]; then
            echo "Image integrity check FAILED - could not inspect pulled image"
            exit 1
          fi
          echo "Image integrity verified - image pulled and inspected successfully - OIDC token has the required read permissions"
 
 
  test-oidc-docker-raw:
    name: Docker Image - Native docker login with OIDC Token
    runs-on: default
    needs: resolve-env
    permissions:
      id-token: write
      contents: read
    env:
      JF_HOSTNAME: ${{ needs.resolve-env.outputs.jf_hostname }}
      JF_URL: https://${{ needs.resolve-env.outputs.jf_hostname }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
 
      - name: Setup JFrog CLI
        id: setup-cli
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}
 
      - name: Verify OIDC connectivity
        run: |
          echo "=== Server ping ==="
          jf rt ping
          echo "=== Artifactory version ==="
          jf rt curl api/system/version
 
      - name: Authenticate Docker with OIDC token (native docker login)
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ${{ env.JF_HOSTNAME }}
          username: ${{ steps.setup-cli.outputs.oidc-user }}
          password: ${{ steps.setup-cli.outputs.oidc-token }}
 
      - name: Pull Docker image from public remote repository - should pass
        run: |
          REMOTE_IMAGE="$JF_HOSTNAME/dockerhub-remote/nginx:1.28.0-alpine"
          docker pull --platform=linux/amd64 $REMOTE_IMAGE
          PULLED_IMAGE_ID=$(docker inspect --format='{{.Id}}' $REMOTE_IMAGE)
          echo "Pulled image      : $REMOTE_IMAGE"
          echo "Pulled image ID   : $PULLED_IMAGE_ID"
          if [ -z "$PULLED_IMAGE_ID" ]; then
            echo "Image integrity check FAILED - could not inspect pulled image"
            exit 1
          fi
          echo "Image integrity verified - image pulled and inspected successfully - OIDC token has the required read permissions"
 
  test-oidc-python-package:
    name: Python Package - JFrog CLI (OIDC)
    runs-on: default
    needs: resolve-env
    permissions:
      id-token: write
      contents: read
    env:
      JF_HOSTNAME: ${{ needs.resolve-env.outputs.jf_hostname }}
      JF_URL: https://${{ needs.resolve-env.outputs.jf_hostname }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
 
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}
 
      - name: Verify OIDC connectivity
        run: |
          echo "=== Server ping ==="
          jf rt ping
          echo "=== Artifactory version ==="
          jf rt curl api/system/version
 
      - name: Pull Python package from pypi-remote - should pass
        run: |
          mkdir -p /tmp/pypi-test
          cd /tmp/pypi-test
          jf pip-config --repo-resolve pypi-remote
          jf pip install requests==2.32.3 --no-deps
          echo "pip install from pypi-remote succeeded - OIDC token has the required read permissions"
 
  test-oidc-python-raw:
    name: Python Package - Native pip/twine with OIDC Token
    runs-on: default
    needs: resolve-env
    permissions:
      id-token: write
      contents: read
    env:
      JF_HOSTNAME: ${{ needs.resolve-env.outputs.jf_hostname }}
      JF_URL: https://${{ needs.resolve-env.outputs.jf_hostname }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
 
      - name: Setup JFrog CLI
        id: setup-cli
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}
 
      - name: Verify OIDC connectivity
        run: |
          echo "=== Server ping ==="
          jf rt ping
          echo "=== Artifactory version ==="
          jf rt curl api/system/version
 
      - name: Export OIDC token
        env:
          OIDC_TOKEN: ${{ steps.setup-cli.outputs.oidc-token }}
          OIDC_USER: ${{ steps.setup-cli.outputs.oidc-user }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          echo "JFROG_ACCESS_TOKEN=$OIDC_TOKEN" >> $GITHUB_ENV
          printf "machine %s\nlogin %s\npassword %s\n" "$JF_HOSTNAME" "$OIDC_USER" "$OIDC_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc
 
      - name: Pull Python package from pypi-remote using native pip - should pass
        run: |
          mkdir -p /tmp/pypi-raw-test
          cd /tmp/pypi-raw-test
          pip install \
            --index-url "${JF_URL}/artifactory/api/pypi/pypi-remote/simple" \
            requests==2.32.3 --no-deps
          echo "pip install from pypi-remote using native pip with OIDC token succeeded"
 
  test-oidc-npm:
    name: npm Package - JFrog CLI (OIDC)
    runs-on: default
    needs: resolve-env
    permissions:
      id-token: write
      contents: read
    env:
      JF_HOSTNAME: ${{ needs.resolve-env.outputs.jf_hostname }}
      JF_URL: https://${{ needs.resolve-env.outputs.jf_hostname }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
 
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}
 
      - name: Verify OIDC connectivity
        run: |
          echo "=== Server ping ==="
          jf rt ping
          echo "=== Artifactory version ==="
          jf rt curl api/system/version
 
      - name: Pull npm package from npm-remote - should pass
        run: |
          mkdir -p /tmp/npm-test
          cd /tmp/npm-test
          echo '{"name":"oidc-test","version":"1.0.0"}' > package.json
          jf npm-config --repo-resolve npm-remote
          jf npm install lodash@4.17.21
          echo "npm install from npm-remote succeeded - OIDC token has the required read permissions"
 
  test-oidc-npm-raw:
    name: npm Package - Native npm with OIDC Token
    runs-on: default
    needs: resolve-env
    permissions:
      id-token: write
      contents: read
    env:
      JF_HOSTNAME: ${{ needs.resolve-env.outputs.jf_hostname }}
      JF_URL: https://${{ needs.resolve-env.outputs.jf_hostname }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
 
      - name: Setup JFrog CLI
        id: setup-cli
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}
 
      - name: Verify OIDC connectivity
        run: |
          echo "=== Server ping ==="
          jf rt ping
          echo "=== Artifactory version ==="
          jf rt curl api/system/version
 
      - name: Export OIDC token
        env:
          OIDC_TOKEN: ${{ steps.setup-cli.outputs.oidc-token }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          echo "JFROG_ACCESS_TOKEN=$OIDC_TOKEN" >> $GITHUB_ENV
 
      - name: Configure native npm with OIDC token
        run: |
          npm config set registry "${JF_URL}/artifactory/api/npm/npm-remote/"
          npm config set "//${JF_HOSTNAME}/artifactory/api/npm/npm-remote/:_authToken" "$JFROG_ACCESS_TOKEN"
          npm config set "//${JF_HOSTNAME}/artifactory/api/npm/poc-npm-local/:_authToken" "$JFROG_ACCESS_TOKEN"
          echo "npm configured with OIDC token"
 
      - name: Pull npm package from npm-remote using native npm - should pass
        run: |
          mkdir -p /tmp/npm-raw-test
          cd /tmp/npm-raw-test
          echo '{"name":"oidc-test","version":"1.0.0"}' > package.json
          npm install lodash@4.17.21 --no-save
          echo "npm install from npm-remote using native npm with OIDC token succeeded"
 
 
  test-oidc-nuget:
    name: NuGet Package - JFrog CLI (OIDC)
    runs-on: default
    needs: resolve-env
    permissions:
      id-token: write
      contents: read
    env:
      JF_HOSTNAME: ${{ needs.resolve-env.outputs.jf_hostname }}
      JF_URL: https://${{ needs.resolve-env.outputs.jf_hostname }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
 
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}
 
      - name: Verify OIDC connectivity
        run: |
          echo "=== Server ping ==="
          jf rt ping
          echo "=== Artifactory version ==="
          jf rt curl api/system/version
 
      - name: Pull NuGet package from nuget-remote - should pass
        run: |
          mkdir -p /tmp/nuget-test
          cd /tmp/nuget-test
          cat > packages.config << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<packages>
<package id="Newtonsoft.Json" version="13.0.3" />
</packages>
          EOF
          jf nuget-config --repo-resolve nuget-remote
          jf nuget restore packages.config -PackagesDirectory ./packages
          echo "NuGet restore from nuget-remote succeeded - OIDC token has the required read permissions"
 
  test-oidc-nuget-raw:
    name: NuGet Package - Native dotnet with OIDC Token
    runs-on: default
    needs: resolve-env
    permissions:
      id-token: write
      contents: read
    env:
      JF_HOSTNAME: ${{ needs.resolve-env.outputs.jf_hostname }}
      JF_URL: https://${{ needs.resolve-env.outputs.jf_hostname }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
 
      - name: Setup JFrog CLI
        id: setup-cli
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}
 
      - name: Verify OIDC connectivity
        run: |
          echo "=== Server ping ==="
          jf rt ping
          echo "=== Artifactory version ==="
          jf rt curl api/system/version
 
      - name: Export OIDC token
        run: |
          echo "::add-mask::${{ steps.setup-cli.outputs.oidc-token }}"
          echo "JFROG_ACCESS_TOKEN=${{ steps.setup-cli.outputs.oidc-token }}" >> $GITHUB_ENV
          echo "JFROG_OIDC_USER=${{ steps.setup-cli.outputs.oidc-user }}" >> $GITHUB_ENV
 
      - name: Pull NuGet package from nuget-remote using native dotnet - should pass
        run: |
          mkdir -p /tmp/nuget-raw-test
 
          cat > /tmp/nuget-raw-test/test.csproj << 'EOF'
<Project Sdk="Microsoft.NET.Sdk">
<PropertyGroup>
<TargetFramework>net8.0</TargetFramework>
</PropertyGroup>
<ItemGroup>
<PackageReference Include="Newtonsoft.Json" Version="13.0.3" />
</ItemGroup>
</Project>
          EOF
 
          dotnet nuget disable source "nuget.org" 2>/dev/null || true
          dotnet nuget add source \
            "${JF_URL}/artifactory/api/nuget/v3/nuget-remote/index.json" \
            --name "artifactory-nuget-remote" \
            --username "$JFROG_OIDC_USER" \
            --password "$JFROG_ACCESS_TOKEN" \
            --store-password-in-clear-text
          dotnet restore /tmp/nuget-raw-test/test.csproj
          echo "dotnet restore from nuget-remote using native dotnet with OIDC token succeeded"
 
  collect-results:
    name: Collect and Upload Test Results (CTRF)
    runs-on: default
    needs: [resolve-env, test-oidc-generic, test-oidc-generic-raw, test-oidc-docker, test-oidc-docker-raw, test-oidc-python-package, test-oidc-python-raw, test-oidc-npm, test-oidc-npm-raw, test-oidc-nuget, test-oidc-nuget-raw]
    if: ${{ inputs.upload_tcv && !failure() && !cancelled() }}
    outputs:
      filename: ${{ steps.set-filename.outputs.filename }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
 
      - name: Generate CTRF report
        env:
          GH_TOKEN: ${{ github.token }}
          JIRA_ISSUE_KEY: ${{ inputs.jira_issue_key }}
          OUTPUT_FILE: ${{ env.test_result_filename }}
          RESULT_GENERIC: ${{ needs.test-oidc-generic.result }}
          RESULT_GENERIC_RAW: ${{ needs.test-oidc-generic-raw.result }}
          RESULT_DOCKER: ${{ needs.test-oidc-docker.result }}
          RESULT_DOCKER_RAW: ${{ needs.test-oidc-docker-raw.result }}
          RESULT_PYTHON: ${{ needs.test-oidc-python-package.result }}
          RESULT_PYTHON_RAW: ${{ needs.test-oidc-python-raw.result }}
          RESULT_NPM: ${{ needs.test-oidc-npm.result }}
          RESULT_NPM_RAW: ${{ needs.test-oidc-npm-raw.result }}
          RESULT_NUGET: ${{ needs.test-oidc-nuget.result }}
          RESULT_NUGET_RAW: ${{ needs.test-oidc-nuget-raw.result }}
        run: .github/workflows/scripts/build_oidc_ctrf_report.sh
 
      - name: Upload Test Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.test_result_filename }}
          path: ${{ env.test_result_filename }}
          if-no-files-found: error
 
      - id: set-filename
        name: Set output filename
        run: echo "filename=${{ env.test_result_filename }}" >> "$GITHUB_OUTPUT"
 
  tcv-ctrf-upload:
    name: Upload CTRF to TCV
    needs: collect-results
    if: ${{ inputs.upload_tcv }}
    permissions:
      id-token: write
      actions: read
      contents: read
    uses: CBA-General/gha-base-templates/.github/workflows/tcv-ctrf-upload.yaml@tcv-ctrf-upload-workflow/latest
    with:
      ctrfArtifactName: ${{ needs.collect-results.outputs.filename }}
      testType: SystemIntegration
      jiraReleaseVersions: '[{"projectKey":"HN","fixVersion":"${{ inputs.fix_version }}"}]'
    secrets: inherit
 
  tcv-generate-report:
    name: Generate TCV report
    needs: tcv-ctrf-upload
    if: ${{ inputs.upload_tcv }}
    permissions:
      id-token: write
      actions: read
      contents: read
    uses: CBA-General/gha-base-templates/.github/workflows/tcv-generate-report.yaml@tcv-generate-report-workflow/latest
    with:
      projectKey: HN
      fixVersion: ${{ inputs.fix_version }}
    secrets: inherit