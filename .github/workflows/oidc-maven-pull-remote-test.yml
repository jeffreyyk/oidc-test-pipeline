# Place this file in .github/workflows/ on the repository's default branch to run it manually.
# Requires a runner with the tools noted below and a JFrog OIDC mapping allowing this workflow.
# Repository key used: jk-maven-dev-remote (assumed naming pattern jk-<type>-dev-<remote|local>; edit REMOTE_REPO below if yours differs).
# The OIDC token's group needs Read and Deploy/Cache on the repository.
# Assumes the remote repo mirrors Maven Central.
# Two jobs show up separately in GitHub Actions: one using the JFrog CLI wrapper (jf mvn), one using native Maven.
# jf mvn downloads a build-info extractor JAR from releases.jfrog.io, so the runner needs outbound internet.
name: OIDC Maven pull remote test - JFrog Platform

on:
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        required: true
        type: choice
        options:
          - nonprod
          - prod
        default: nonprod

permissions:
  id-token: write
  contents: read

env:
  OIDC_PROVIDER_NAME: github-oidc-cba-general
  OIDC_AUDIENCE: cba-github-actions
  JF_HOSTNAME: ${{ inputs.env == 'prod' && 'artifactory.cba' || 'psblr.jfrog.io' }}
  JF_URL: ${{ inputs.env == 'prod' && 'https://artifactory.cba' || 'https://psblr.jfrog.io' }}
  REMOTE_REPO: jk-maven-dev-remote
  EXPECTED_PACKAGE_TYPE: maven

jobs:
  test-oidc-maven:
    name: Maven package - JFrog CLI (OIDC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}

      - name: Verify OIDC connectivity
        run: |
          echo "=== Server ping ==="
          jf rt ping
          echo "=== Artifactory version ==="
          jf rt curl api/system/version -s | jq '{version, revision}'

      - name: Check repository exists and has the expected package type
        run: |
          set -euo pipefail
          status=$(jf rt curl -XGET "api/repositories/${REMOTE_REPO}" -s -o "$RUNNER_TEMP/repo.json" -w "%{http_code}")
          echo "HTTP $status for repository config"
          if [ "$status" != "200" ]; then
            head -c 1000 "$RUNNER_TEMP/repo.json"; echo
            echo "::error::Cannot read repository ${REMOTE_REPO} (HTTP $status)"
            exit 1
          fi
          jq '{key, rclass, packageType}' "$RUNNER_TEMP/repo.json"
          actual=$(jq -r '.packageType // ""' "$RUNNER_TEMP/repo.json" | tr '[:upper:]' '[:lower:]')
          if [ "$actual" != "$EXPECTED_PACKAGE_TYPE" ]; then
            echo "::warning::Repository packageType is '$actual', expected '$EXPECTED_PACKAGE_TYPE'"
          fi

      - name: Direct download through remote repo (junit POM)
        run: |
          set -euo pipefail
          path="${REMOTE_REPO}/junit/junit/4.13.2/junit-4.13.2.pom"
          status=$(jf rt curl -XGET "$path" -s -L -o "$RUNNER_TEMP/direct.out" -w "%{http_code}")
          echo "HTTP $status for $path"
          if [ "$status" != "200" ]; then
            echo "Response body (first 1000 bytes):"
            head -c 1000 "$RUNNER_TEMP/direct.out"; echo
            echo "::error::Expected HTTP 200 (see the response body above for the reason)"
            exit 1
          fi
          echo "$path" >> "$RUNNER_TEMP/verified.txt"

      - name: Resolve dependency with JFrog CLI (jf mvn)
        if: always()
        run: |
          set -euo pipefail
          workdir=$(mktemp -d "$RUNNER_TEMP/maven-cli-test.XXXXXX")
          cd "$workdir"
          cat > pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example.oidc</groupId>
            <artifactId>oidc-maven-cli-pull-test</artifactId>
            <version>1.0.0</version>
            <dependencies>
              <dependency>
                <groupId>junit</groupId>
                <artifactId>junit</artifactId>
                <version>4.13.2</version>
              </dependency>
            </dependencies>
          </project>
          EOF
          jf mvn-config --server-id-resolve=setup-jfrog-cli-server \
            --repo-resolve-releases="$REMOTE_REPO" --repo-resolve-snapshots="$REMOTE_REPO"
          # Clear build name/number so no build-info collection is attempted (see the Conan workflow)
          env -u JFROG_CLI_BUILD_NAME -u JFROG_CLI_BUILD_NUMBER \
            jf mvn -B -ntp -Dmaven.repo.local="$RUNNER_TEMP/m2-cli" \
            org.apache.maven.plugins:maven-dependency-plugin:3.6.1:resolve
          echo "junit:junit:4.13.2 via jf mvn" >> "$RUNNER_TEMP/verified.txt"
          echo "jf mvn resolve through ${REMOTE_REPO} succeeded"

      - name: Job summary
        if: always()
        env:
          TARGET_ENV: ${{ inputs.env }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Maven package - JFrog CLI (OIDC)"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Result | ${JOB_STATUS} |"
            echo "| Target environment | ${TARGET_ENV} |"
            echo "| Artifactory | ${JF_URL} |"
            echo "| Repository | ${REMOTE_REPO} |"
            if [ -f "$RUNNER_TEMP/repo.json" ]; then
              jq -r '"| Repository type | \(.rclass) / \(.packageType) |"' "$RUNNER_TEMP/repo.json"
            fi
            echo "| Workflow run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
            if [ -f "$RUNNER_TEMP/verified.txt" ]; then
              echo ""
              echo "**Verified:**"
              sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/verified.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test-oidc-maven-raw:
    name: Maven package - Native Maven with OIDC Token
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup JFrog CLI
        id: setup-cli
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}

      - name: Verify OIDC connectivity
        run: |
          echo "=== Server ping ==="
          jf rt ping
          echo "=== Artifactory version ==="
          jf rt curl api/system/version -s | jq '{version, revision}'

      - name: Export OIDC credentials
        env:
          OIDC_TOKEN: ${{ steps.setup-cli.outputs.oidc-token }}
          OIDC_USER: ${{ steps.setup-cli.outputs.oidc-user }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          if [ -z "$OIDC_USER" ]; then
            echo "::warning::oidc-user output is empty; clients that need basic auth may fail"
          fi
          {
            echo "JF_OIDC_TOKEN=$OIDC_TOKEN"
            echo "JF_OIDC_USER=$OIDC_USER"
            echo "JF_OIDC_USER_ENC=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$OIDC_USER")"
          } >> "$GITHUB_ENV"

      - name: Resolve artifact with native Maven
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/settings.xml" <<'EOF'
          <settings>
            <servers>
              <server>
                <id>artifactory</id>
                <username>${env.JF_OIDC_USER}</username>
                <password>${env.JF_OIDC_TOKEN}</password>
              </server>
            </servers>
            <mirrors>
              <mirror>
                <id>artifactory</id>
                <mirrorOf>*</mirrorOf>
                <url>${env.JF_URL}/artifactory/${env.REMOTE_REPO}</url>
              </mirror>
            </mirrors>
          </settings>
          EOF
          mvn -B -ntp -s "$RUNNER_TEMP/settings.xml" -Dmaven.repo.local="$RUNNER_TEMP/m2" \
            org.apache.maven.plugins:maven-dependency-plugin:3.6.1:get -Dartifact=junit:junit:4.13.2
          echo "junit:junit:4.13.2 via native mvn" >> "$RUNNER_TEMP/verified.txt"
          echo "mvn dependency:get through ${REMOTE_REPO} succeeded"

      - name: Job summary
        if: always()
        env:
          TARGET_ENV: ${{ inputs.env }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Maven package - Native Maven with OIDC Token"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Result | ${JOB_STATUS} |"
            echo "| Target environment | ${TARGET_ENV} |"
            echo "| Artifactory | ${JF_URL} |"
            echo "| Repository | ${REMOTE_REPO} |"
            echo "| Workflow run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
            if [ -f "$RUNNER_TEMP/verified.txt" ]; then
              echo ""
              echo "**Verified:**"
              sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/verified.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
