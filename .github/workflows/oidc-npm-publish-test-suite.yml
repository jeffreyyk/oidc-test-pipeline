# Place this file in .github/workflows/ on the default branch to run it manually.
# Requires a "default" runner with Node.js/npm and an OIDC mapping allowing this workflow.
# jk-project-dev-local must already be an npm local repository with read/deploy permissions.
# Test packages remain in Artifactory; each run/attempt publishes a new prerelease version.
name: OIDC npm Publish Test Suite - JFrog Platform

on:
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        required: true
        type: choice
        options:
          - nonprod
          - prod
        default: nonprod

permissions:
  id-token: write
  contents: read

env:
  OIDC_PROVIDER_NAME: github-oidc-cba-general
  OIDC_AUDIENCE: cba-github-actions
  JF_HOSTNAME: ${{ inputs.env == 'prod' && 'artifactory.cba' || 'jfrog-poc.saas.cba' }}
  JF_URL: ${{ inputs.env == 'prod' && 'https://artifactory.cba' || 'https://jfrog-poc.saas.cba' }}
  NPM_REPOSITORY: jk-project-dev-local
  PACKAGE_VERSION: 1.0.0-run.${{ github.run_id }}.${{ github.run_attempt }}

defaults:
  run:
    shell: bash

jobs:
  test-oidc-npm:
    name: Publish npm Package - JFrog CLI (OIDC)
    runs-on: default
    env:
      PACKAGE_NAME: oidc-npm-cli-test-${{ github.repository_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup JFrog CLI
        id: setup-cli
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}

      - name: Verify OIDC connectivity
        run: jf rt ping

      - name: Publish and verify npm package using JFrog CLI
        env:
          NODE_AUTH_TOKEN: ${{ steps.setup-cli.outputs.oidc-token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$NODE_AUTH_TOKEN"
          package_dir=$(mktemp -d "${RUNNER_TEMP}/oidc-npm-cli-publish.XXXXXX")
          cd "$package_dir"
          trap 'rm -f .npmrc' EXIT

          printf '{"name":"%s","version":"%s","main":"index.js","files":["index.js"]}\n' \
            "$PACKAGE_NAME" "$PACKAGE_VERSION" > package.json
          printf 'module.exports = "OIDC npm publish test";\n' > index.js

          registry="${JF_URL}/artifactory/api/npm/${NPM_REPOSITORY}/"
          printf 'registry=%s\n' "$registry" > .npmrc
          printf '//%s/artifactory/api/npm/%s/:_authToken=${NODE_AUTH_TOKEN}\n' \
            "$JF_HOSTNAME" "$NPM_REPOSITORY" >> .npmrc
          chmod 600 .npmrc

          jf npm-config --repo-resolve "$NPM_REPOSITORY" --repo-deploy "$NPM_REPOSITORY"
          jf npm publish --tag oidc-test

          published_version=$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry "$registry")
          if [ "$published_version" != "$PACKAGE_VERSION" ]; then
            echo "ERROR: Published package version does not match $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "Verified ${PACKAGE_NAME}@${PACKAGE_VERSION} in ${NPM_REPOSITORY}"

  test-oidc-npm-raw:
    name: Publish npm Package - Native npm with OIDC Token
    runs-on: default
    env:
      PACKAGE_NAME: oidc-npm-raw-test-${{ github.repository_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup JFrog CLI
        id: setup-cli
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}

      - name: Verify OIDC connectivity
        run: jf rt ping

      - name: Publish and verify npm package using native npm
        env:
          NODE_AUTH_TOKEN: ${{ steps.setup-cli.outputs.oidc-token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$NODE_AUTH_TOKEN"
          package_dir=$(mktemp -d "${RUNNER_TEMP}/oidc-npm-raw-publish.XXXXXX")
          cd "$package_dir"
          trap 'rm -f .npmrc' EXIT

          printf '{"name":"%s","version":"%s","main":"index.js","files":["index.js"]}\n' \
            "$PACKAGE_NAME" "$PACKAGE_VERSION" > package.json
          printf 'module.exports = "OIDC npm publish test";\n' > index.js

          registry="${JF_URL}/artifactory/api/npm/${NPM_REPOSITORY}/"
          printf 'registry=%s\n' "$registry" > .npmrc
          printf '//%s/artifactory/api/npm/%s/:_authToken=${NODE_AUTH_TOKEN}\n' \
            "$JF_HOSTNAME" "$NPM_REPOSITORY" >> .npmrc
          chmod 600 .npmrc

          npm publish --registry "$registry" --tag oidc-test

          published_version=$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry "$registry")
          if [ "$published_version" != "$PACKAGE_VERSION" ]; then
            echo "ERROR: Published package version does not match $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "Verified ${PACKAGE_NAME}@${PACKAGE_VERSION} in ${NPM_REPOSITORY}"
