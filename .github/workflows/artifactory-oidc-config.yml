version: "1.1"
repositories:
  - name: "actions-oidc-test"
    package_type: "docker"
    description: "OIDC test repository - existing repo without environment suffix"
    use_existing_name: true
    environments:
      staging:
        read:
          - "github-workflow:.github/workflows/oidc-auth-publish-test.yml@refs/heads/main"
          - "github-workflow:.github/workflows/oidc-auth-publish-test.yml@refs/heads/HN-3032-fix-mvp"
        deploy:
          - "github-workflow:.github/workflows/oidc-auth-publish-test.yml@refs/heads/main"
          - "github-workflow:.github/workflows/oidc-auth-publish-test.yml@refs/heads/HN-3032-fix-mvp"
  - name: "dharmdi-artifactory"
    package_type: "generic"
    description: "Dharmdi test repository"
    environments:
      staging:
        read:
          - "github-workflow:.github/workflows/oidc-auth-publish-test.yml@refs/heads/main"
  - name: "terraform-state-aimee"
    package_type: "generic"
    description: "Terraform state repository for Aimee"
    environments:
      staging:
        read:
          - "github-workflow:.github/workflows/oidc-auth-publish-test.yml@refs/heads/main"
          - "github-workflow:.github/workflows/oidc-auth-publish-test.yml@refs/heads/HN-3032-fix-mvp"
  - name: "e2e-test-read-only"
    package_type: "generic"
    description: "End-to-end test repository with read-only permissions"
    environments:
      staging:
        read:
          - "github-workflow:.github/workflows/oidc-usage-test-pull.yml@refs/heads/main"
          - "github-workflow:.github/workflows/oidc-usage-test-pull.yml@refs/heads/test-1-read-permissions"
  - name: "e2e-test-write-deploy"
    package_type: "generic"
    description: "End-to-end test repository with read and deploy permissions"
    environments:
      staging:
        read:
          - "github-workflow:.github/workflows/oidc-usage-test-combined.yml@refs/heads/main"
          - "github-workflow:.github/workflows/oidc-usage-test-combined.yml@refs/heads/test-2-write-permissions"
        deploy:
          - "github-workflow:.github/workflows/oidc-usage-test-combined.yml@refs/heads/main"
          - "github-workflow:.github/workflows/oidc-usage-test-combined.yml@refs/heads/test-2-write-permissions"
  - name: "e2e-multi-repo-libs"
    package_type: "generic"
    description: "Multi-repository test - library dependencies (read-only access)"
    environments:
      staging:
        read:
          - "github-workflow:.github/workflows/oidc-comprehensive-test.yml@refs/heads/main"
          - "github-workflow:.github/workflows/oidc-comprehensive-test.yml@refs/heads/test-3-multi-repository"
  - name: "e2e-multi-repo-artifacts"
    package_type: "generic"
    description: "Multi-repository test - build artifacts (read + deploy access)"
    environments:
      staging:
        read:
          - "github-workflow:.github/workflows/oidc-comprehensive-test.yml@refs/heads/main"
          - "github-workflow:.github/workflows/oidc-comprehensive-test.yml@refs/heads/test-3-multi-repository"
        deploy:
          - "github-workflow:.github/workflows/oidc-comprehensive-test.yml@refs/heads/main"
          - "github-workflow:.github/workflows/oidc-comprehensive-test.yml@refs/heads/test-3-multi-repository"