# Place this file in .github/workflows/ on the repository's default branch to run it manually.
# Requires a "default" runner with Node.js/npm and a JFrog OIDC mapping allowing this workflow.
name: OIDC npm pull push remote debug - JFrog Platform

on:
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        required: true
        type: choice
        options:
          - nonprod
          - prod
        default: nonprod

permissions:
  id-token: write
  contents: read

env:
  OIDC_PROVIDER_NAME: github-oidc-cba-general
  OIDC_AUDIENCE: cba-github-actions
  JF_HOSTNAME: ${{ inputs.env == 'prod' && 'artifactory.cba' || 'psblr.jfrog.io' }}
  JF_URL: ${{ inputs.env == 'prod' && 'https://artifactory.cba' || 'https://psblr.jfrog.io' }}

jobs:
  test-oidc-npm:
    name: npm Package - JFrog CLI (OIDC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}

      - name: Verify OIDC connectivity
        run: |
          echo "=== Server ping ==="
          jf rt ping
          echo "=== Artifactory version ==="
          jf rt curl api/system/version

      - name: Check repo access
        run: |
          jf rt curl -XGET "api/repositories/jk-npm-dev-remote" -s -o /dev/null -w "%{http_code}\n"
          jf rt curl -XGET "api/npm/jk-npm-dev-remote/lodash" -s -o /dev/null -w "%{http_code}\n"

      - name: Fetch tarball directly
        run: |
          jf rt curl -XGET "jk-npm-dev-remote/lodash/-/lodash-4.17.21.tgz" -s -o /dev/null -w "%{http_code}\n"

      - name: Pull npm package from jk-npm-dev-remote - should pass
        run: |
          mkdir -p /tmp/npm-test
          cd /tmp/npm-test
          echo '{"name":"oidc-test","version":"1.0.0"}' > package.json
          jf npm-config --repo-resolve jk-npm-dev-remote
          jf npm install lodash@4.17.21
          echo "npm install from jk-npm-dev-remote succeeded - OIDC token has the required read permissions"

  test-oidc-npm-raw:
    name: npm Package - Native npm with OIDC Token
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup JFrog CLI
        id: setup-cli
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}

      - name: Verify OIDC connectivity
        run: |
          echo "=== Server ping ==="
          jf rt ping
          echo "=== Artifactory version ==="
          jf rt curl api/system/version

      - name: Check repo access
        run: |
          jf rt curl -XGET "api/repositories/jk-npm-dev-remote" -s -o /dev/null -w "%{http_code}\n"
          jf rt curl -XGET "api/npm/jk-npm-dev-remote/lodash" -s -o /dev/null -w "%{http_code}\n"

      - name: Fetch tarball directly
        run: |
          jf rt curl -XGET "jk-npm-dev-remote/lodash/-/lodash-4.17.21.tgz" -s -o /dev/null -w "%{http_code}\n"

      - name: Export OIDC token
        env:
          OIDC_TOKEN: ${{ steps.setup-cli.outputs.oidc-token }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          echo "JFROG_ACCESS_TOKEN=$OIDC_TOKEN" >> $GITHUB_ENV

      - name: Diagnose
        run: |
          python3 - << 'EOF'
          import os, json, base64
          p = os.environ["JFROG_ACCESS_TOKEN"].split(".")[1]
          p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print(json.dumps({k: c.get(k) for k in ("sub", "scp", "exp")}, indent=2))
          EOF
          jf rt curl -XGET "jk-npm-dev-remote/lodash/-/lodash-4.17.21.tgz" -s -o /tmp/tgz.out -w "tarball HTTP %{http_code}\n"
          head -c 1500 /tmp/tgz.out; echo

      - name: Configure native npm with OIDC token
        run: |
          npm config set registry "${JF_URL}/artifactory/api/npm/jk-npm-dev-remote/"
          npm config set "//${JF_HOSTNAME}/artifactory/api/npm/jk-npm-dev-remote/:_authToken" "$JFROG_ACCESS_TOKEN"
          npm config set "//${JF_HOSTNAME}/artifactory/api/npm/jk-project-dev-local/:_authToken" "$JFROG_ACCESS_TOKEN"
          echo "npm configured with OIDC token"

      - name: Pull npm package from npm-remote using native npm - should pass
        run: |
          mkdir -p /tmp/npm-raw-test
          cd /tmp/npm-raw-test
          echo '{"name":"oidc-test","version":"1.0.0"}' > package.json
          npm install lodash@4.17.21 --no-save
          echo "npm install from npm-remote using native npm with OIDC token succeeded"
