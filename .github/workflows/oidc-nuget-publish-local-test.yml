# Place this file in .github/workflows/ on the repository's default branch to run it manually.
# Requires a runner with the tools noted below and a JFrog OIDC mapping allowing this workflow.
# Repository key used: jk-nuget-dev-local (assumed naming pattern jk-<type>-dev-<remote|local>; edit LOCAL_REPO below if yours differs).
# The OIDC token's group needs Read, Deploy/Cache and Annotate on the repository.
# Each run publishes a new version; test packages remain in Artifactory.
# Two jobs show up separately in GitHub Actions: one using the JFrog CLI (jf rt upload), one using native dotnet nuget push.
name: OIDC NuGet publish local test - JFrog Platform

on:
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        required: true
        type: choice
        options:
          - nonprod
          - prod
        default: nonprod

permissions:
  id-token: write
  contents: read

env:
  OIDC_PROVIDER_NAME: github-oidc-cba-general
  OIDC_AUDIENCE: cba-github-actions
  JF_HOSTNAME: ${{ inputs.env == 'prod' && 'artifactory.cba' || 'psblr.jfrog.io' }}
  JF_URL: ${{ inputs.env == 'prod' && 'https://artifactory.cba' || 'https://psblr.jfrog.io' }}
  LOCAL_REPO: jk-nuget-dev-local
  EXPECTED_PACKAGE_TYPE: nuget

jobs:
  test-oidc-nuget:
    name: NuGet package - JFrog CLI (OIDC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}

      - name: Verify OIDC connectivity
        run: |
          echo "=== Server ping ==="
          jf rt ping
          echo "=== Artifactory version ==="
          jf rt curl api/system/version -s | jq '{version, revision}'

      - name: Check repository exists and has the expected package type
        run: |
          set -euo pipefail
          status=$(jf rt curl -XGET "api/repositories/${LOCAL_REPO}" -s -o "$RUNNER_TEMP/repo.json" -w "%{http_code}")
          echo "HTTP $status for repository config"
          if [ "$status" != "200" ]; then
            head -c 1000 "$RUNNER_TEMP/repo.json"; echo
            echo "::error::Cannot read repository ${LOCAL_REPO} (HTTP $status)"
            exit 1
          fi
          jq '{key, rclass, packageType}' "$RUNNER_TEMP/repo.json"
          actual=$(jq -r '.packageType // ""' "$RUNNER_TEMP/repo.json" | tr '[:upper:]' '[:lower:]')
          if [ "$actual" != "$EXPECTED_PACKAGE_TYPE" ]; then
            echo "::warning::Repository packageType is '$actual', expected '$EXPECTED_PACKAGE_TYPE'"
          fi

      - name: Pack and publish with JFrog CLI (jf rt upload)
        run: |
          set -euo pipefail
          verify() {
            local s
            s=$(jf rt curl -XGET "$1" -s -L -o /dev/null -w "%{http_code}")
            echo "HTTP $s for $1"
            [ "$s" = "200" ] || { echo "::error::Verification failed for $1 (HTTP $s)"; exit 1; }
            echo "$1" >> "$RUNNER_TEMP/verified.txt"
          }
          workdir=$(mktemp -d "$RUNNER_TEMP/publish-cli.XXXXXX")
          cd "$workdir"
          version="1.0.0-run.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          dotnet new classlib -n OidcCliPublishTest -o pkg
          dotnet pack pkg -c Release -p:PackageId=oidc-nuget-cli-test -p:PackageVersion="$version" -o out
          # jf dotnet has no publish command, so the package is uploaded with jf rt upload
          jf rt upload "out/*.nupkg" "${LOCAL_REPO}/" --flat=true
          verify "${LOCAL_REPO}/oidc-nuget-cli-test.${version}.nupkg"

      - name: Job summary
        if: always()
        env:
          TARGET_ENV: ${{ inputs.env }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### NuGet package - JFrog CLI (OIDC)"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Result | ${JOB_STATUS} |"
            echo "| Target environment | ${TARGET_ENV} |"
            echo "| Artifactory | ${JF_URL} |"
            echo "| Repository | ${LOCAL_REPO} |"
            if [ -f "$RUNNER_TEMP/repo.json" ]; then
              jq -r '"| Repository type | \(.rclass) / \(.packageType) |"' "$RUNNER_TEMP/repo.json"
            fi
            echo "| Workflow run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
            if [ -f "$RUNNER_TEMP/verified.txt" ]; then
              echo ""
              echo "**Verified:**"
              sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/verified.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test-oidc-nuget-raw:
    name: NuGet package - Native .NET with OIDC Token
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup JFrog CLI
        id: setup-cli
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}

      - name: Verify OIDC connectivity
        run: |
          echo "=== Server ping ==="
          jf rt ping
          echo "=== Artifactory version ==="
          jf rt curl api/system/version -s | jq '{version, revision}'

      - name: Export OIDC credentials
        env:
          OIDC_TOKEN: ${{ steps.setup-cli.outputs.oidc-token }}
          OIDC_USER: ${{ steps.setup-cli.outputs.oidc-user }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          if [ -z "$OIDC_USER" ]; then
            echo "::warning::oidc-user output is empty; clients that need basic auth may fail"
          fi
          {
            echo "JF_OIDC_TOKEN=$OIDC_TOKEN"
            echo "JF_OIDC_USER=$OIDC_USER"
            echo "JF_OIDC_USER_ENC=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$OIDC_USER")"
          } >> "$GITHUB_ENV"

      - name: Pack and push with native .NET and the OIDC token
        run: |
          set -euo pipefail
          verify() {
            local s
            s=$(curl -s -L -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${JF_OIDC_TOKEN}" "${JF_URL}/artifactory/$1")
            echo "HTTP $s for $1"
            [ "$s" = "200" ] || { echo "::error::Verification failed for $1 (HTTP $s)"; exit 1; }
            echo "$1" >> "$RUNNER_TEMP/verified.txt"
          }
          workdir=$(mktemp -d "$RUNNER_TEMP/publish-raw.XXXXXX")
          cd "$workdir"
          version="1.0.0-run.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          dotnet new classlib -n OidcPublishTest -o pkg
          dotnet pack pkg -c Release -p:PackageId=oidc-nuget-test -p:PackageVersion="$version" -o out
          dotnet new nugetconfig
          dotnet nuget add source "${JF_URL}/artifactory/api/nuget/v3/${LOCAL_REPO}/index.json" \
            --name artifactory --username "$JF_OIDC_USER" --password "$JF_OIDC_TOKEN" \
            --store-password-in-clear-text --configfile nuget.config
          # No --api-key: Artifactory reads that header as the credential, so a dummy value can cause a 403.
          # Authentication comes from the username and token stored in nuget.config.
          dotnet nuget push "out/oidc-nuget-test.${version}.nupkg" --source artifactory \
            --configfile nuget.config
          verify "${LOCAL_REPO}/oidc-nuget-test.${version}.nupkg"

      - name: Job summary
        if: always()
        env:
          TARGET_ENV: ${{ inputs.env }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### NuGet package - Native .NET with OIDC Token"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Result | ${JOB_STATUS} |"
            echo "| Target environment | ${TARGET_ENV} |"
            echo "| Artifactory | ${JF_URL} |"
            echo "| Repository | ${LOCAL_REPO} |"
            echo "| Workflow run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
            if [ -f "$RUNNER_TEMP/verified.txt" ]; then
              echo ""
              echo "**Verified:**"
              sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/verified.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
